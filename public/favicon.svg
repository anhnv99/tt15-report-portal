<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for App Icon Squircle -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07193F" />
      <stop offset="100%" stop-color="#0B2A6B" />
    </linearGradient>
    
    <!-- Primary Blue Gradient for Document Body -->
    <linearGradient id="doc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E63FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Vibrant Sky to Cyan Gradient for Checkmark -->
    <linearGradient id="check-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#08B5FF" />
      <stop offset="100%" stop-color="#67E8FF" />
    </linearGradient>
    
    <!-- Subtle shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#08B5FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base for App Icon / Favicon -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Document Body & Loop (Forms top of 'R') -->
  <g transform="translate(4, 0)">
    <!-- Main Document Contour -->
    <path d="M 32 22 
             C 24 22 18 28 18 36 
             L 18 84 
             C 18 92 24 98 32 98 
             L 42 98 
             C 45 98 47 95 47 92 
             L 47 88 
             C 47 85 45 83 42 83 
             L 32 83 
             C 30 83 29 81 29 79 
             L 29 36 
             C 29 34 30 33 32 33 
             L 70 33 
             C 72 33 73 34 73 36 
             L 73 46 
             C 73 48 75 50 78 51 
             L 90 54 
             C 93 55 95 52 94 49 
             L 86 31 
             C 80 23 72 22 62 22 
             Z" 
          fill="url(#doc-grad)" />

    <!-- Document Lines -->
    <rect x="38" y="41" width="24" height="6.5" rx="3.25" fill="#38BDF8" opacity="0.9" />
    <rect x="38" y="53" width="16" height="6.5" rx="3.25" fill="#38BDF8" opacity="0.75" />

    <!-- Compliance Checkmark (Forms leg of 'R') -->
    <path d="M 36 67 
             C 33 64 29 64 26 67 
             C 23 70 23 74 26 77 
             L 47 98 
             C 49 100 53 100 55 98 
             L 97 54 
             C 100 51 100 47 97 44 
             C 94 41 90 41 87 44 
             L 51 82 
             Z" 
          fill="url(#check-grad)" 
          filter="url(#glow)" />
  </g>
</svg>
